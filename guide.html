<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#25386a">
<title>Guide de programmation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
:root{
  --navy:#25386a; --navy2:#2f4680; --bg:#cfdcf7; --bg2:#b9c9ee; --panel:#fff; --side:#bccbea;
  --tab:#c4d0ec; --tabOn:#6e86c4; --val:#6189e6; --valDim:#c1d1f5; --lab:#4b6fd1; --txt:#1f2a44;
  --org:#e18b2c; --red:#c3141f; --redTxt:#d0202a; --green:#24b45a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Fira Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}

/* ---------- barre du haut (comme le programmateur) ---------- */
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:600;position:sticky;top:0;z-index:20}
.top a.home{color:#fff;text-decoration:none;font-size:20px;line-height:1;padding:2px 6px}
.top .it{display:flex;align-items:center;gap:6px;white-space:nowrap}
.top .chip{background:#fff;color:var(--navy);border-radius:4px;padding:2px 9px;font-size:13px}
.top .sp{flex:1}
.top button{background:#fff;color:var(--navy);border:0;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.top button.on{background:var(--org);color:#fff}
.band{background:#9db6ef;height:10px}

/* ---------- liste des fiches ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:12px 10px 40px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;height:44px;border-radius:10px;border:1.5px solid #9fb3e6;padding:0 12px;font-size:15px;background:#fff}
.btnP{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:0 16px;height:44px;font-weight:700;font-size:14px;cursor:pointer}
.btnS{background:#fff;color:var(--navy);border:1.5px solid #9fb3e6;border-radius:10px;padding:0 14px;height:40px;font-weight:700;font-size:13px;cursor:pointer}
.grp{margin:16px 2px 8px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--navy2);text-transform:uppercase}
.card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;border:1px solid #b5c6ee}
.card .ic{width:44px;height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 44px;text-align:center;line-height:1.1}
.card .t{font-weight:800;font-size:15px;color:var(--navy)}
.card .m{font-size:12.5px;color:#56627d;margin-top:2px}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.tag.o{background:#fdebd6;color:#b05c0c}.tag.r{background:#fde2e3;color:var(--red)}.tag.n{background:#e5ecfb;color:var(--navy2)}
.empty{text-align:center;color:#56627d;padding:30px 10px;font-size:14px}

/* ---------- écran fiche ---------- */
.tabs{display:flex;gap:4px;align-items:stretch;padding:10px 8px 0;overflow-x:auto}
.tab{background:var(--tab);color:var(--txt);border:0;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--tabOn);color:#fff}
.tab.dis{opacity:.75;cursor:default}
.pen{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--org);color:#fff;font-size:10px;align-items:center;justify-content:center;border:2px solid #fff}
.tools{display:flex;gap:8px;padding:8px 8px 0;flex-wrap:wrap}
.tools .btnS{height:34px;font-size:12.5px}
.tools .btnS.on{background:var(--org);color:#fff;border-color:var(--org)}
.screen{padding:8px}

/* sections Brady (colonne grise à gauche + panneau blanc) */
.sec{display:flex;margin-bottom:6px}
.sec .side{width:150px;flex:0 0 150px;background:var(--side);padding:14px 10px;font-size:15px;color:var(--txt);cursor:pointer;display:flex;gap:8px;align-items:flex-start;line-height:1.25}
.sec .side .ar{font-weight:900;color:var(--navy);transform:translateY(1px)}
.sec .side.mod{color:var(--org)}
.sec .body{flex:1;background:var(--panel);padding:10px 14px;min-width:0}
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;padding:6px 0}
.sumrow + .sumrow{border-top:1px dashed #b8c3dc}
.si{padding:4px 6px;border:2px solid transparent;border-radius:2px;min-width:0}
.si .l{color:var(--lab);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .v{font-size:14.5px;margin-top:3px;font-weight:500}
.si.o .v{color:var(--org)}
.chk{border-color:var(--red)!important}
.subh{font-weight:800;font-size:14px;margin:10px 0 2px;color:var(--txt)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 16px;padding:4px 0 8px}
.grid4 + .grid4{border-top:1px dashed #b8c3dc;padding-top:8px}
.colh{font-weight:800;font-size:13.5px;color:var(--txt);text-transform:uppercase;margin:2px 0 0}
.f{padding:3px;border:2px solid transparent;border-radius:2px;margin-bottom:2px;min-width:0}
.f .l{color:var(--lab);font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:var(--val);color:#fff;font-weight:700;font-size:13px;padding:10px 9px;border-radius:2px;cursor:pointer;min-height:38px;display:flex;align-items:center;gap:6px;position:relative}
.box.o{background:var(--org)}
.box.dim{background:var(--valDim)}
.box .cm{position:absolute;right:4px;top:2px;font-size:11px}
.box.ro{cursor:default}

/* mise en avant : le reste est atténué */
.focus .box:not(.o):not(.hl), .focus .si:not(.o):not(.chk) .v, .focus .zv:not(.o){opacity:.35}
.focus .f:not(.chk) .box:not(.o){opacity:.35}

/* ---------- Tachy ---------- */
.tachy{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:12px}
.zgrid{background:#fff;padding:10px 10px 12px;overflow-x:auto}
.zin{min-width:560px;display:grid;grid-template-columns:100px repeat(4,minmax(0,1fr));column-gap:6px;row-gap:12px;align-items:center;position:relative}
.zh{font-weight:700;font-size:14px;text-align:center}
.axis{grid-column:2/6;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--lab);font-size:13px;color:var(--lab);font-weight:600;padding-bottom:3px}
.axis span{text-align:right;padding-right:2px}
.zl{color:var(--lab);font-size:13px;font-weight:600;text-transform:uppercase}
.tg{display:flex;align-items:center;gap:6px;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}
.sw{width:42px;height:24px;border-radius:12px;background:var(--val);position:relative;flex:0 0 42px}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.off{background:var(--redTxt)}.sw.off::after{left:2px;right:auto}
.sw.o{background:var(--org)}
.tg .y{color:var(--lab)}.tg .y.o{color:var(--org)}.tg .n{color:var(--redTxt)}
.zv{background:var(--val);color:#fff;font-weight:700;font-size:13px;padding:10px 8px;border-radius:2px;cursor:pointer;min-height:38px;display:flex;align-items:center;border:2px solid transparent}
.zv.o{background:var(--org)}
.zdisc{border:1.5px solid #6a7590;background:#fff;color:var(--txt);font-weight:700;font-size:13.5px;padding:8px;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;min-height:38px;align-items:center}
.zdisc.o{color:var(--org)}
.ther{padding-right:22px!important;border:1.5px solid #6a7590;border-radius:3px;background:#fff;padding:6px 8px;cursor:pointer;font-weight:700;font-size:13.5px;line-height:1.95;position:relative}
.ther .go,.zdisc .go{position:absolute;right:8px;top:4px;font-weight:900}
.ther .x{color:var(--redTxt)}.ther .o{color:var(--org)}
.vline{border-left:2px solid var(--lab);align-self:stretch}
.right{background:#fff;padding:12px}
.rr{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;align-items:center;margin-bottom:10px}
.rr .l{color:var(--lab);font-size:13.5px;font-weight:600}
.rsep{border-top:1px dashed #8d98b4;margin:6px 0 14px}
.sensrow{background:#fff;margin-top:8px;padding:10px;display:flex;align-items:center;gap:14px}
.sensrow .l{color:var(--lab);font-weight:600;font-size:13.5px}
.ztitle{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.ztitle button{background:var(--tabOn);color:#fff;border:0;padding:8px 14px;font-weight:700;cursor:pointer}
.ztitle h2{margin:0;font-size:20px;color:var(--txt)}
.cols{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.colc{background:#fff;min-width:0}
.colc .hd{background:#c4d0ec;text-align:center;padding:12px;font-size:14px}
.colc .in{display:grid;gap:4px 12px;padding:10px 12px}

/* ---------- notes ---------- */
.notes{background:#fff;margin:10px 8px;padding:12px 14px;border-left:5px solid var(--org)}
.notes h3{margin:0 0 6px;font-size:14px;color:var(--navy)}
.notes .txt{white-space:pre-wrap;font-size:14px;line-height:1.45}
.notes textarea{width:100%;min-height:90px;border:1.5px solid #9fb3e6;border-radius:8px;padding:8px;font-size:14px}
.meta{background:#fff;margin:10px 8px 0;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.meta label{font-size:12px;font-weight:700;color:var(--lab);display:block;margin-bottom:4px}
.meta input,.meta select{width:100%;height:40px;border:1.5px solid #9fb3e6;border-radius:8px;padding:0 10px;font-size:14px;background:#fff}
.legend{font-size:12px;color:#3d4a68;padding:6px 10px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}

/* ---------- fenêtre de choix (comme le programmateur) ---------- */
.ovl{position:fixed;inset:0;background:rgba(28,38,70,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.pop{background:#cfe0fb;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pop .ph{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800;text-transform:uppercase;font-size:15px;position:sticky;top:0}
.pop .ph .u{font-weight:600;text-transform:none;opacity:.9}
.pop .ph .x{margin-left:auto;background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer}
.pop .pb{padding:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.opt{background:var(--val);color:#fff;border:0;padding:12px 6px;font-weight:700;font-size:14px;cursor:pointer;position:relative;min-height:46px}
.opt.nom{text-decoration:underline}
.opt.sel{background:var(--org)}
.opt.ro{cursor:default}
.leg{font-size:12px;color:#3a55a8;margin-top:12px;line-height:1.6}
.pop .row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.pop input[type=text],.pop textarea{flex:1;min-width:0;border:1.5px solid #8aa2dc;border-radius:6px;padding:9px;font-size:14px;background:#fff}
.pop textarea{width:100%;min-height:64px}
.pop label.ck{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--txt);margin-top:10px}
.pop label.ck input{width:20px;height:20px}
.pop .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pop .acts button{height:44px;border:0;font-weight:800;cursor:pointer}
.pop .acts .a1{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.pop .acts .a2{background:var(--navy);color:#fff}
.info{background:#fff;padding:10px;font-size:14px;line-height:1.5;margin-top:10px;white-space:pre-wrap}

@media (max-width:760px){
  .sec{flex-direction:column}
  .sec .side{width:auto;flex:none;padding:10px 12px}
  .sumrow,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tachy{grid-template-columns:minmax(0,1fr)}
  .f .l,.si .l{white-space:normal}
  .zl{font-size:12px}
  .tab{padding:9px 12px;font-size:14px}
}

/* ================= iPhone (portrait) ================= */
.head{position:sticky;top:0;z-index:20}
.mtop{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:8px}
.mtop a{color:#fff;text-decoration:none;font-size:28px;line-height:1;padding:0 8px 2px 4px}
.mtop .tt{flex:1;min-width:0}
.mtop .tt b{display:block;font-size:16px;word-break:normal;overflow-wrap:break-word;line-height:1.2}
.mtop .tt span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mtop button{background:#fff;color:var(--navy);border:0;border-radius:18px;padding:8px 13px;font-weight:800;font-size:13px}
.mtop button.on{background:var(--org);color:#fff}
.mtabs{display:grid;grid-template-columns:repeat(4,1fr);background:#dfe7fa;border-bottom:1px solid #b6c5ea}
.mtabs button{border:0;background:none;padding:11px 2px 9px;font-size:13.5px;font-weight:700;color:#53608a;border-bottom:3px solid transparent;position:relative}
.mtabs button.on{color:var(--navy);border-bottom-color:var(--navy);background:#fff}
.mtabs .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--org)}
.mtool{display:flex;gap:8px;padding:10px 10px 4px;align-items:center}
.seg{display:flex;flex:1;background:#fff;border:1.5px solid #9fb3e6;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:9px 4px;font-weight:700;font-size:13px;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.mleg{font-size:11.5px;color:#4a5676;padding:2px 12px 6px;display:flex;gap:12px;flex-wrap:wrap}
.mleg i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:4px;border-radius:2px}
.mscr{padding:4px 10px 10px}
.mc{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;border:1px solid #c3d0ef}
.mh{display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:800;font-size:15px;color:var(--navy)}
.mh .tl{flex:1}
.mh .chev{color:#8a98bd;font-size:15px;transition:transform .15s}
.mc.cl .mh .chev{transform:rotate(-90deg)}
.mc.cl .mb{display:none}
.bd{font-size:11.5px;font-weight:800;border-radius:10px;padding:2px 8px;min-width:22px;text-align:center}
.bd.o{background:var(--org);color:#fff}.bd.r{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.mb{border-top:1px solid #e1e7f6}
.msub{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6b78a0;padding:10px 14px 4px;background:#f5f7fd}
.mr{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-bottom:1px solid #eef1f9;min-height:48px;cursor:pointer}
.mr:last-child{border-bottom:0}
.mr .ml{flex:1;font-size:14px;color:#2b3554;line-height:1.25}
.mr .mv{flex:0 0 auto;max-width:56%;background:var(--val);color:#fff;font-weight:700;font-size:13.5px;padding:7px 10px;border-radius:6px;text-align:right;line-height:1.2}
.mr .mv.o{background:var(--org)}
.mr .mv.dim{background:var(--valDim)}
.mr.chk{box-shadow:inset 0 0 0 2.5px var(--red);border-radius:6px}
.mr.chk .ml{color:var(--red);font-weight:700}
.mr .ml small{display:block;color:#7c87a6;font-size:12px;font-weight:500;margin-top:2px}
.mcm{font-size:12px}
.mgo{display:block;width:calc(100% - 24px);margin:8px 12px 12px;background:#e9effd;color:var(--navy);border:0;border-radius:9px;padding:11px;font-weight:800;font-size:14px}
.ruler{display:flex;border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid #9fb3e6}
.ruler div{flex:1;text-align:center;padding:8px 2px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;line-height:1.25}
.ruler div b{display:block;font-size:14px}
.ruler .z0{background:#7d97d6}.ruler .z1{background:#5c79c4}.ruler .z2{background:#3f5ba8}.ruler .z3{background:#25386a}
.ruler div.o b{color:#ffc47e}
.mc.off .mb{opacity:.45}
.onoff{font-size:12px;font-weight:800;border-radius:12px;padding:4px 10px;color:#fff;background:var(--val)}
.onoff.n{background:var(--redTxt)}.onoff.o{background:var(--org)}
.onoff.chk{box-shadow:0 0 0 2px var(--red)}
.mback{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.mback button{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 13px;font-weight:800}
.mback b{font-size:17px;color:var(--navy)}
.mtab{font-size:13px;font-weight:900;color:var(--navy2);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 8px}
.mempty{background:#fff;border-radius:12px;padding:22px 14px;text-align:center;color:#56627d;font-size:14px}
@media (max-width:760px){
  .ovl{align-items:flex-end;padding:0}
  .pop{max-width:none;border-radius:16px 16px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}
  .pop .ph{border-radius:16px 16px 0 0;font-size:14px;padding:14px}
  .opts{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
  .opt{min-height:44px;font-size:13.5px;border-radius:6px}
  .meta{grid-template-columns:1fr 1fr;margin:10px 10px 0;border-radius:12px}
  .meta>div:last-child{grid-column:1/3}
  .notes{margin:6px 10px 20px;border-radius:0 12px 12px 0}
  .wrap .card{padding:10px}
}

/* ---------- modifications masquées (état « programmé ») ---------- */
.nohl .box.o,.nohl .zv.o,.nohl .mv.o,.nohl .opt.sel{background:var(--val)}
.nohl .si.o .v,.nohl .ther .o,.nohl .zdisc.o,.nohl .tg .y.o{color:inherit}
.nohl .ther .o{color:var(--txt)}
.nohl .sw.o,.nohl .onoff.o{background:var(--val)}
.nohl .ruler div.o b{color:#fff}
.nohl .sec .side.mod{color:var(--txt)}
.nohl .pen,.nohl .mtabs .dot,.nohl .bd.o,.nohl .lg-o{display:none}
.hlbtn{white-space:nowrap}
/* ---------- accueil du guide ---------- */
.intro{font-size:13.5px;color:#3d4a68;line-height:1.45;margin:2px 2px 12px}
.mdl{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid #b5c6ee;box-shadow:0 1px 3px rgba(37,56,106,.08)}
.mdl .mhd{display:flex;gap:12px;align-items:center;padding:14px;background:linear-gradient(90deg,#25386a,#3a5296);color:#fff}
.mdl .mic{width:50px;height:50px;border-radius:12px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:0 0 50px}
.mdl .mhd b{display:block;font-size:16px}
.mdl .mhd span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.frow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #e6ebf7;cursor:pointer}
.frow .fi{flex:1;min-width:0}
.frow .fi b{display:block;font-size:14.5px;color:var(--navy);word-break:normal;overflow-wrap:break-word}
.frow .fi small{display:block;font-size:12px;color:#5e6a87;margin-top:2px}
.frow .tags{margin-top:5px}
.frow .ch{font-size:20px;color:#8a98bd}
.ren{border:1.5px solid #b5c6ee;background:#fff;color:var(--navy);border-radius:8px;width:38px;height:38px;font-size:16px;flex:0 0 38px;cursor:pointer}
.frow.def{background:#f3f6fe}
.frow.def .ico{font-size:20px}
.addr{display:block;width:calc(100% - 28px);margin:10px 14px 14px;border:1.5px dashed #8aa2dc;background:#fff;color:var(--navy);border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer}
.defnote{background:#fff7ea;border-left:4px solid var(--org);padding:9px 12px;font-size:13px;color:#5b4520;margin:10px 8px 0;border-radius:0 8px 8px 0}
@media (max-width:760px){ .defnote{margin:8px 10px 0} }

/* listes déroulantes du programmateur (Stim. post-choc, Paramètres Auto-Seuil) */
.dd{margin-top:10px;border:2px solid transparent}
.ddh{border:1.5px solid #3b4560;background:#fff;color:var(--txt);font-weight:700;font-size:13px;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-radius:3px}
.ddh.o{color:var(--org)}
.nohl .ddh.o{color:var(--txt)}
.ddb{background:#cfdcf7;padding:8px 7px 4px}
.lockb{background:#fff;color:var(--navy);border:0;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.tag.l{background:#e6e9f2;color:#3c4766}
/* iPhone : même écran que le programmateur, en plus compact */
@media (max-width:760px){
  .mtabs{background:var(--bg);gap:3px;padding:8px 6px 0;border:0}
  .mtabs button{background:var(--tab);color:var(--txt);border:0;font-size:13.5px;padding:10px 2px}
  .mtabs button.on{background:var(--tabOn);color:#fff}
  .mscr.prog{padding:6px 6px 10px}
  .prog .sec{margin-bottom:5px}
  .prog .sec .side{font-size:14px;padding:9px 10px}
  .prog .sec .body{padding:8px 9px}
  .prog .grid4,.prog .sumrow{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}
  .prog .box{font-size:12.5px;padding:9px 7px;min-height:36px}
  .prog .f .l,.prog .si .l{font-size:12px;white-space:normal}
  .prog .si .v{font-size:13.5px}
  .prog .tachy{grid-template-columns:minmax(0,1fr);gap:6px}
  .prog .zgrid{padding:8px 4px 10px;overflow:visible}
  .prog .zin{min-width:0;grid-template-columns:56px repeat(4,minmax(0,1fr));column-gap:3px;row-gap:9px}
  .prog .zh{font-size:12px}
  .prog .axis{font-size:11px}
  .prog .zl{font-size:10.5px;word-break:break-word}
  .prog .zv{font-size:11px;padding:8px 4px;min-height:34px}
  .prog .zdisc{font-size:11px;padding:6px 4px;min-height:34px}
  .prog .ther{font-size:11px;padding:5px 16px 5px 4px!important;line-height:1.9}
  .prog .ther .go,.prog .zdisc .go{right:3px}
  .prog .tg{font-size:11px;gap:3px;flex-wrap:wrap}
  .prog .sw{width:34px;height:20px;flex:0 0 34px}.prog .sw::after{width:16px;height:16px}
  .prog .right{padding:10px}
  .prog .rr{grid-template-columns:1fr 1fr}
  .prog .sensrow{flex-wrap:wrap;gap:8px}
  .prog .colc{flex:1 1 100%!important}
  .prog .ztitle h2{font-size:16px}
}

/* pas de zoom involontaire */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}

/* ---------- Brady ---------- */
function dOpen(f, groups) { const g = groups.filter(([, ks]) => ks.some(k => avail(k, f.type))); return `<div class="grid4">${g.map(([sub, ks]) => col(f, sub, ks)).join('')}</div>`; }
function dSecs(f, defs, sums) { return defs.map(([id, t, g]) => { const keys = g.flatMap(x => x[1]).filter(k => avail(k, f.type)); if (!keys.length) return ''; const sm = (sums && sums[id]) ? sums[id] : `<div class="sumrow">${g.map(([sub, ks]) => { const k = ks.find(x => avail(x, f.type)); return k ? sumItem(f, sub || P[k].l, [k]) : ''; }).filter(Boolean).slice(0, 8).join('')}</div>`; return section(f, id, t, keys, sm, dOpen(f, g)); }).join(''); }
const F = (f, keys, head) => { const h = keys.filter(k => avail(k, f.type)).map(k => field(f, k)).join(''); return h ? (head ? `<div class="colh">${head}</div>` : '') + h : ''; };
const C4 = (...c) => c.some(Boolean) ? `<div class="grid4">${c.map(x => `<div>${x || ''}</div>`).join('')}</div>` : '';
function dd(f, id, title, keys) {
  keys = keys.filter(k => avail(k, f.type)); if (!keys.length) return '';
  const op = !!S.open['dd_' + id], mod = keys.some(k => isMod(f, k)), c = keys.some(k => isChk(f, k));
  return `<div class="dd ${c ? 'chk' : ''}"><div class="ddh ${mod ? 'o' : ''}" data-dd="${id}">${esc(title)}<span>${op ? '⌃' : '⌄'}</span></div>${op ? `<div class="ddb">${keys.map(k => field(f, k)).join('')}</div>` : ''}</div>`;
}
function renderBrady(f) {
  const t = f.type, A = hasA(t), C = isCRT(t);
  const g = id => B_SECT.find(x => x[0] === id)[2].flatMap(x => x[1]);
  const sums = {
    base: `<div class="sumrow">${sumItem(f, 'Mode', ['mode'])}${sumItem(f, 'Fréquence de base / Fréquence max.', ['fbase', 'fmax'])}${A ? sumItem(f, 'DAV repos / DAV effort', ['davRep', 'davEff']) : '<div></div>'}${C ? sumItem(f, 'Cavités stimulées', ['cavV']) : '<div></div>'}</div><div class="sumrow">${sumItem(f, 'Asservissement', ['asserv'])}${C ? sumItem(f, 'Délai VV', ['delaiVV']) + sumItem(f, 'Optimisation CRT SonR', ['sonrOpt']) : ''}</div>`,
    adv: `<div class="sumrow">${sumItem(f, 'Lissage', ['lissage'])}${A ? sumItem(f, 'Repli', ['repli']) : '<div></div>'}${sumItem(f, 'Sensibilité auto sur bruit / Stimulation V sur bruit', ['sensBruit', 'stimBruit'])}${sumItem(f, 'Paramètres post-choc', ['pcMode', 'pcFreq', 'pcDur'])}</div>`,
    sondes: (A ? `<div class="sumrow">${sumItem(f, 'Amp. A / Largeur A', ['ampA', 'largA'])}${sumItem(f, 'Polarité de stimulation A', ['polA'])}${sumItem(f, 'Sensibilité A', ['sensA'])}${sumItem(f, 'Auto-Seuil A', ['autoA'])}</div>` : '') +
      `<div class="sumrow">${sumItem(f, 'Amp. VD / Largeur VD', ['ampVD', 'largVD'])}${sumItem(f, 'Polarité de stimulation VD', ['polVD'])}${sumItem(f, 'Sensibilité VD', ['sensVD'])}${sumItem(f, 'Auto-Seuil VD', ['autoVD'])}</div>` +
      (C ? `<div class="sumrow">${sumItem(f, 'Amp. VG / Largeur VG', ['ampVG', 'largVG'])}${sumItem(f, 'Polarité de stimulation VG', ['polVG'])}${t === '4LV' ? sumItem(f, 'Stim. MultiPoint', ['mp']) : '<div></div>'}${sumItem(f, 'Auto-Seuil VG', ['autoVG'])}</div>` : '')
  };
  const base = C4(F(f, ['mode', 'bav1', 'prEff', 'prRep', 'pause']), F(f, ['fbase', 'fmax', 'hyst']), F(f, ['davRep', 'davEff', 'extDav', 'delaiVV', 'stimVGs']), F(f, ['cavV'])) + C4(F(f, ['asserv', 'actPhys']), F(f, ['sonrOpt', 'sonrFreq']), '', '');
  const adv = C4(F(f, ['lissage', 'antiTRE']), F(f, ['repli', 'fRepli']), F(f, ['sensBruit', 'stimBruit'], 'Gestion du bruit'),
      F(f, ['pcMode', 'pcFreq', 'pcDur'], 'Paramètres post-choc') + dd(f, 'pc', 'Stim. post-choc', ['pcDavRep', 'pcDavEff', 'pcExtDav', 'pcAmpA', 'pcLargA', 'pcAmpVD', 'pcLargVD', 'pcAmpVG', 'pcLargVG'])) +
    C4(F(f, ['refAV', 'refAR'], 'Périodes réfractaires'), F(f, ['margeA', 'margeV'], 'Marges de sensibilité'), F(f, ['overdrive', 'fOverdrive', 'suppPauseES', 'accelESA'], 'Prévention arythmies A'), F(f, ['stimAESV', 'suppPause', 'accelESV', 'fAccel'], 'Prévention arythmies V'));
  const sond = (A ? `<div class="subh">SONDE A</div>` + C4(F(f, ['ampA', 'largA']), F(f, ['polA']), F(f, ['sensA']), F(f, ['autoA']) + dd(f, 'asA', 'Paramètres Auto-Seuil', ['asAMarge', 'asAMin', 'asASec', 'asAMax', 'asAFmax', 'asAHeure'])) : '') +
    `<div class="subh">SONDE VD</div>` + C4(F(f, ['ampVD', 'largVD']), F(f, ['polVD']), F(f, ['sensVD']), F(f, ['autoVD']) + dd(f, 'asVD', 'Paramètres Auto-Seuil', ['asMarge', 'asAmpMin', 'asAmpSec', 'asAmpMax', 'asFmax'])) +
    (C ? `<div class="subh">SONDE VG</div>` + C4(F(f, ['ampVG', 'largVG']), F(f, ['polVG']), F(f, ['mp', 'polMP1', 'polMP2']), F(f, ['autoVG']) + dd(f, 'asVG', 'Paramètres Auto-Seuil', ['asVGMarge', 'asVGMin', 'asVGSec', 'asVGMax', 'asVGHeure'])) : '');
  return section(f, 'base', 'Paramètres de base', g('base'), sums.base, base) + section(f, 'adv', 'Paramètres avancés', g('adv'), sums.adv, adv) + section(f, 'sondes', 'Sondes', g('sondes'), sums.sondes, sond);
}

/* ---------- Tachy ---------- */
function therSummary(f, z) {
  const line = (k, html) => `<div>${html}</div>`;
  const atp = a => { const p = val(f, z + '_' + a + 'prog'), k = z + '_' + a + 'prog'; const m = [k, z + '_' + a + 'nb'].some(x => isMod(f, x)); return p === 'Non' ? `<span class="${m ? 'o' : 'x'}">Non</span>` : `<span class="${m ? 'o' : ''}">${esc((val(f, z + '_' + a + 'nb') || '') + ' ' + p)}</span>`; };
  const ch = k => { const v = val(f, k), m = isMod(f, k); if (v === 'Non') return `<span class="${m ? 'o' : 'x'}">Non</span>`; return `<span class="${m ? 'o' : ''}">${k.endsWith('c42') ? esc(v) + ' × 42 J' : esc(v) + ' J'}</span>`; };
  if (z === 'FV') return '';
  return line(0, atp('a1')) + line(0, atp('a2')) + line(0, ch(z + '_c1')) + line(0, ch(z + '_c2')) + line(0, ch(z + '_c42'));
}
function zbox(f, k, span) { const o = isMod(f, k); return `<div class="zv ${o ? 'o' : ''} ${isChk(f, k) ? 'chk' : ''}" style="${span || ''}" data-k="${k}">${esc(fmt(k, val(f, k)))}${hasCm(f, k) ? ' 💬' : ''}</div>`; }
function ztog(f, k, label) {
  const on = val(f, k) === 'Oui', o = isMod(f, k);
  return `<div class="tg ${isChk(f, k) ? 'chk' : ''}" data-sw="1" data-k="${k}">${label ? `<span style="color:var(--txt)">${label}</span>` : ''}<span class="sw ${on ? (o ? 'o' : '') : 'off'}"></span><span class="${on ? 'y ' + (o ? 'o' : '') : 'n'}">${on ? 'OUI' : 'NON'}</span></div>`;
}
function renderTachy(f) {
  const tvl = val(f, 'tvlOn') === 'Oui', tv = val(f, 'tvOn') === 'Oui', tvr = val(f, 'tvrOn') === 'Oui';
  const anyMod = keys => keys.some(k => isMod(f, k)), anyChk = keys => keys.some(k => isChk(f, k));
  const zKeys = z => Object.keys(P).filter(k => k.startsWith(z + '_'));
  const ther = z => `<div class="ther ${anyChk(zKeys(z)) ? 'chk' : ''}" data-zone="${z}"><span class="go">»</span>${therSummary(f, z)}</div>`;
  const fvATP = (() => { const p = val(f, 'FV_a1prog'), m = isMod(f, 'FV_a1prog') || isMod(f, 'FV_a1nb'); return p === 'Non' ? `<span class="${m ? 'o' : 'x'}">Non</span>` : `<span class="${m ? 'o' : ''}">${esc(val(f, 'FV_a1nb') + ' ' + p)}</span>`; })();
  const fvCh = ['FV_c1', 'FV_c2', 'FV_c42'].map(k => { const v = val(f, k), m = isMod(f, k); return `<div class="${v === 'Non' ? (m ? 'o' : 'x') : (m ? 'o' : '')}">${v === 'Non' ? 'Non' : (k.endsWith('c42') ? esc(v) + ' × 42 J' : esc(v) + ' J')}</div>`; }).join('');
  const ax = [tvl ? val(f, 'fTVL') : '', tv ? val(f, 'fTV') : '', tvr ? val(f, 'fTVR') : '', val(f, 'fFV')];
  const g = `<div class="zgrid"><div class="zin">
    <div></div><div class="zh">TV lente</div><div class="zh">TV</div><div class="zh" style="grid-column:4/6">FV</div>
    <div></div><div class="axis"><span>${esc(ax[0])}</span><span>${esc(ax[1])}</span><span>${esc(ax[2])}</span><span>${esc(ax[3])}</span></div>
    <div class="zl">Zones</div><div>${ztog(f, 'tvlOn')}</div><div>${ztog(f, 'tvOn')}</div><div style="grid-column:4/6">${ztog(f, 'tvrOn', 'TV Rapide')}</div>
    <div class="zl">Fréquence</div><div>${tvl ? zbox(f, 'fTVL') : ''}</div><div>${tv ? zbox(f, 'fTV') : ''}</div><div>${tvr ? zbox(f, 'fTVR') : ''}</div><div>${zbox(f, 'fFV')}</div>
    <div class="zl">Persistance</div><div>${tvl ? zbox(f, 'pTVL') : ''}</div><div>${tv ? zbox(f, 'pTV') : ''}</div><div style="grid-column:4/6">${zbox(f, 'pFV')}</div>
    <div class="zl">Discrimination</div>${!(tvl || tv) ? '<div style="grid-column:2/4"></div>' : `<div style="grid-column:${tvl && tv ? '2/4' : tvl ? '2/3' : '3/4'}" class="zdisc ${['discTV'].concat(DISC_KEYS).some(k => isMod(f, k)) ? 'o' : ''} ${['discTV'].concat(DISC_KEYS).some(k => isChk(f, k)) ? 'chk' : ''}" data-zone="DISC">${esc(val(f, 'discTV'))}<span>»</span></div>`}${tvl && !tv ? '<div></div>' : ''}<div>${tvr ? zbox(f, 'discTVR') : ''}</div><div></div>
    <div class="zl" style="line-height:2.05;align-self:start;padding-top:6px">ATP 1<br>ATP 2<br>CHOC 1<br>CHOC 2<br>CHOC 42 J</div>
    <div style="align-self:start">${tvl ? ther('TVL') : ''}</div><div style="align-self:start">${tv ? ther('TV') : ''}</div>
    <div style="grid-column:4/6;align-self:start">${tvr ? `<div class="ther ${anyChk(zKeys('FV')) ? 'chk' : ''}" data-zone="FV" style="display:inline-block;min-width:48%;margin-bottom:8px"><span class="go">»</span>${fvATP}</div>` : ''}
      <div class="ther" data-zone="FV"><span class="go">»</span>${fvCh}</div></div>
  </div></div>`;
  const rr = k => avail(k, f.type) ? `<div class="rr"><div class="l">${esc(P[k].l)}</div>${['atpOn', 'chocOn'].includes(k) ? `<div class="tg ${isChk(f, k) ? 'chk' : ''}" data-sw="1" data-k="${k}" style="justify-content:flex-start"><span class="sw ${val(f, k) === 'Oui' ? '' : 'off'}" style="${val(f, k) === 'Oui' ? 'background:var(--green)' : ''}"></span><span style="color:${val(f, k) === 'Oui' ? 'var(--green)' : 'var(--redTxt)'}">${esc(val(f, k))}</span></div>` : `<div class="f ${isChk(f, k) ? 'chk' : ''}" style="margin:0"><div class="box ${isMod(f, k) ? 'o' : (PT(f.type, k).dim ? 'dim' : '')}" data-k="${k}">${esc(fmt(k, val(f, k)))}${hasCm(f, k) ? '<span class="cm">💬</span>' : ''}</div></div>`}</div>` : '';
  const right = `<div class="right">${rr('atpOn')}${rr('chocOn')}<div class="rsep"></div>${rr('cavATP')}${rr('autoComATP')}${rr('polAlt')}${rr('coilVCS')}${rr('boitier')}${rr('vecteur')}${rr('exclVCS')}</div>`;
  return `<div class="tachy"><div>${g}<div class="sensrow"><span class="l">Sensibilité VD</span><div class="f ${isChk(f, 'sensVD') ? 'chk' : ''}" style="margin:0;min-width:120px"><div class="box ${isMod(f, 'sensVD') ? 'o' : ''}" data-k="sensVD">${esc(fmt('sensVD', val(f, 'sensVD')))}</div></div><span style="flex:1"></span><button class="btnS" data-sondes="1">Paramètres sondes »</button></div></div>${right}</div>`;
}
function renderZone(f, z) {
  if (z === 'DISC') return renderDisc(f);
  const atpCol = (a, title) => `<div class="colc" style="flex:2 1 300px"><div class="hd">${title}</div><div class="in" style="grid-template-columns:1fr 1fr">${ATP_FIELDS.map(([k]) => field(f, z + '_' + a + k)).join('')}</div></div>`;
  const chocs = `<div class="colc" style="flex:1 1 160px"><div class="hd">Chocs</div><div class="in">${field(f, z + '_c1')}${field(f, z + '_c2')}${field(f, z + '_c42')}</div></div>`;
  const title = z === 'FV' ? 'Thérapies en zone FV / TV rapide' : 'Thérapies en zone ' + ZONES[z];
  return `<div class="ztitle"><button data-zback="1">‹ Retour</button><h2>${title}</h2></div><div class="cols">${z === 'FV' ? atpCol('a1', 'ATP (TV rapide)') : atpCol('a1', 'ATP 1') + atpCol('a2', 'ATP 2')}${chocs}</div>`;
}

function discShown(f) { return !/PARAD/.test(val(f, 'discTV')); }
function renderDisc(f) {
  const ks = discShown(f) ? DISC_KEYS : ['ecouteA'];
  return `<div class="ztitle"><button data-zback="1">‹ Retour</button><h2>Critères de discrimination</h2></div>
    <div class="cols"><div class="colc" style="flex:0 1 460px"><div class="hd">Critères de discrimination</div><div class="in" style="grid-template-columns:1fr 1fr">
    <div>${field(f, 'discTV', 'Critères de discrimination')}${['dAccel', 'dMajY', 'dCLext', 'dMajX'].filter(k => ks.includes(k)).map(k => field(f, k)).join('')}</div>
    <div>${['dCLall', 'dStabTV', 'dStabTVR', 'ecouteA'].filter(k => ks.includes(k)).map(k => field(f, k)).join('')}</div></div></div></div>`;
}
/* ---------- Suivi à distance / IRM ---------- */
const RS_OFF = [['rsSys', 'Système', [['', ['rsSuivi']]]]];
const rsDefs = f => val(f, 'rsSuivi') === 'Oui' ? R_SECT : RS_OFF;
function renderRS(f) { if (val(f, 'rsSuivi') !== 'Oui') S.open.rsSys = true; return dSecs(f, rsDefs(f)); }
function renderIRM(f) { return dSecs(f, I_SECT); }

/* ---------- fenêtre de choix / détail ---------- */
function openPop(k) {
  const f = S.cur, p = PT(f.type, k), v = val(f, k), ovl = $('#ovl');
  const opts = (p.o || []).slice(); if (p.o && v && !opts.includes(v)) opts.push(v);
  const title = (p.t || p.l);
  let b = '';
  if (S.edit) {
    b = `${opts.length ? `<div class="opts">${opts.map(o => `<button class="opt ${o === p.nom ? 'nom' : ''} ${o === v && v !== p.nom ? 'sel' : ''}" data-v="${esc(o)}">${esc(o)}${o === v ? ' •' : ''}</button>`).join('')}</div>` : ''}
      <div class="row"><input type="text" id="pVal" placeholder="${opts.length ? 'Autre valeur' : 'Valeur'}" value="${opts.includes(v) ? '' : esc(v)}" ${p.u && !p.o ? 'inputmode="decimal"' : ''}><span>${esc(p.u || '')}</span><button class="btnS" id="pSet" style="height:38px">Valider</button></div>
      <div class="leg">Valeur soulignée : valeur par défaut, boîtier neuf (${esc(fmt(k, p.nom))})</div>
      <label class="ck"><input type="checkbox" id="pMark" ${f.mark && f.mark[k] ? 'checked' : ''}> Compter comme réglage à faire même si c'est la valeur par défaut</label>
      <label class="ck"><input type="checkbox" id="pChk" ${isChk(f, k) ? 'checked' : ''}> Encadrer en rouge (à vérifier)</label>
      <div style="margin-top:10px;font-size:12.5px;font-weight:700;color:var(--lab)">Commentaire</div><textarea id="pCm" placeholder="Pourquoi ce réglage, à quoi faire attention…">${esc((f.comments || {})[k] || '')}</textarea>
      <div class="acts"><button class="a1" id="pNom">Valeur par défaut</button><button class="a2" id="pOk">Fermer</button></div>`;
  } else {
    b = `${opts.length ? `<div class="opts">${opts.map(o => `<button class="opt ro ${o === p.nom ? 'nom' : ''} ${o === v && isMod(f, k) ? 'sel' : ''}">${esc(o)}${o === v ? ' •' : ''}</button>`).join('')}</div>` : ''}
      <div class="info"><b>Réglage : ${esc(fmt(k, v))}</b>${isMod(f, k) ? ' — <span style="color:var(--org);font-weight:800">à programmer</span>' : ''}${isChk(f, k) ? ' — <span style="color:var(--red);font-weight:800">à vérifier</span>' : ''}\nValeur par défaut (boîtier neuf) : ${esc(fmt(k, p.nom))}${hasCm(f, k) ? '\n\n💬 ' + esc(f.comments[k]) : ''}</div>`;
  }
  ovl.innerHTML = `<div class="pop" role="dialog" aria-modal="true"><div class="ph"><span>${esc(title)}</span>${p.u ? `<span class="u">(${esc(p.u)})</span>` : ''}<button class="x" id="pX" aria-label="Fermer">✕</button></div><div class="pb">${b}</div></div>`;
  ovl.classList.remove('hidden');
  const close = () => { ovl.classList.add('hidden'); ovl.innerHTML = ''; };
  $('#pX').addEventListener('click', close);
  ovl.onclick = e => { if (e.target === ovl) close(); };
  if (!S.edit) return;
  const keepExtras = () => {
    f.values = f.values || {}; f.mark = f.mark || {}; f.chk = f.chk || {}; f.comments = f.comments || {};
    if ($('#pMark').checked) f.mark[k] = 1; else delete f.mark[k];
    if ($('#pChk').checked) f.chk[k] = 1; else delete f.chk[k];
    const c = $('#pCm').value.trim(); if (c) f.comments[k] = c; else delete f.comments[k];
  };
  const apply = async (newV) => { keepExtras(); if (newV === p.nom) delete f.values[k]; else f.values[k] = newV; await save(f); close(); renderFiche(); };
  const done = async () => { keepExtras(); await save(f); close(); renderFiche(); };
  ovl.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => apply(o.dataset.v)));
  $('#pSet').addEventListener('click', () => { const t = $('#pVal').value.trim(); if (t) apply(t); });
  $('#pVal').addEventListener('keydown', e => { if (e.key === 'Enter') { const t = e.target.value.trim(); if (t) apply(t); } });
  ['#pMark', '#pChk'].forEach(id => $(id).addEventListener('change', async () => { keepExtras(); await save(f); }));
  $('#pOk').addEventListener('click', done);
  $('#pX').addEventListener('click', done);
  ovl.onclick = e => { if (e.target === ovl) done(); };
  $('#pNom').addEventListener('click', () => apply(p.nom));
}

/* ---------- démarrage ---------- */
(async function start() {
  await loadList();
  let v = ''; try { v = localStorage.getItem('mp_guide_seeded') || ''; } catch (e) {}
  if (v !== '3') {
    const fresh = seedFiches();
    // anciens types → modèles
    for (const f of S.list) if (LEGACY[f.type]) { f.type = LEGACY[f.type]; delete f.appareil; await save(f); }
    if (!v && !S.list.length) { for (const f of fresh) await save(f); }
    else if (v) {
      // exemples DR / VR recalés sur les fiches techniques (notes et commentaires conservés)
      for (const n of fresh) {
        const old = S.list.find(f => f.type === n.type && f.variante === n.variante);
        if (old) await save(Object.assign({}, n, { id: old.id, notes: old.notes || '', comments: old.comments || {} }));
      }
    }
    try { localStorage.setItem('mp_guide_seeded', '3'); } catch (e) {}
    await loadList();
  }
  S.list.forEach(f => { if (!MODELS[f.type]) f.type = 'DR'; });
  const id = location.hash.slice(1);
  if (id && (S.list.some(f => f.id === id) || /^defaut-/.test(id))) openFiche(id); else renderList();
})();
// bloque le zoom au pincement et au double-toucher (Safari iPhone)
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
window.__guide = { S, P, openFiche, renderList };
</script>
